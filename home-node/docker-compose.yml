version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MoviePlayer VR Cinema – Home Node  (free / no-account setup)
# ─────────────────────────────────────────────────────────────────────────────
# Required .env keys (copy .env.example → .env and edit):
#   MEDIA_DIR        – host path to your movies folder (use forward slashes)
#   CLARITY_PACK_DIR – host path for upscaled Clarity Pack output
#
# Two Cloudflare Quick-Tunnel containers print *.trycloudflare.com URLs to
# stdout on startup.  No account, no token, no credit card required.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  cinema:
    driver: bridge

volumes:
  hls_data:   # shared HLS segments between packager and mediamtx

services:

  # ── Packager ────────────────────────────────────────────────────────────────
  packager:
    build:
      context: ./packager
      dockerfile: Dockerfile
    container_name: cinema-packager
    restart: unless-stopped
    environment:
      MEDIA_DIR: /media
      CLARITY_PACK_DIR: /clarity
      MEDIAMTX_URL: http://mediamtx:9997
    volumes:
      - ${MEDIA_DIR}:/media:ro
      - ${CLARITY_PACK_DIR:-/tmp/clarity}:/clarity
      - hls_data:/hls
    ports:
      - "8080:8080"
    networks:
      - cinema
    depends_on:
      - mediamtx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Clarity Worker ──────────────────────────────────────────────────────────
  clarity-worker:
    build:
      context: ./clarity-worker
      dockerfile: Dockerfile
    container_name: cinema-clarity-worker
    restart: unless-stopped
    environment:
      MEDIA_DIR: /media
      CLARITY_PACK_DIR: /clarity
      FAST_MODE: ${CLARITY_FAST_MODE:-0}
    volumes:
      - ${MEDIA_DIR}:/media:ro
      - ${CLARITY_PACK_DIR:-/tmp/clarity}:/clarity
    networks:
      - cinema
    # GPU passthrough – silently ignored if no NVIDIA runtime is present
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── MediaMTX (HLS + RTSP server) ────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cinema-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - hls_data:/hls
    ports:
      - "8888:8888"   # HLS
      - "8554:8554"   # RTSP
      - "9997:9997"   # API
    networks:
      - cinema

  # ── In-Memory Sync Server (replaces Fly.io cloud) ───────────────────────────
  sync-server:
    build:
      context: ./sync-server
      dockerfile: Dockerfile
    container_name: cinema-sync-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - cinema
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Cloudflare Quick Tunnel — HLS Media ─────────────────────────────────────
  # Prints a *.trycloudflare.com URL to its logs on startup.
  # Read it with: docker logs home-node-cloudflared-media-1
  cloudflared-media:
    image: cloudflare/cloudflared:latest
    container_name: cinema-cloudflared-media
    restart: unless-stopped
    command: tunnel --url http://mediamtx:8888 --no-autoupdate
    networks:
      - cinema
    depends_on:
      - mediamtx

  # ── Cloudflare Quick Tunnel — Sync API ──────────────────────────────────────
  # Prints a *.trycloudflare.com URL to its logs on startup.
  # Read it with: docker logs home-node-cloudflared-api-1
  cloudflared-api:
    image: cloudflare/cloudflared:latest
    container_name: cinema-cloudflared-api
    restart: unless-stopped
    command: tunnel --url http://sync-server:3000 --no-autoupdate
    networks:
      - cinema
    depends_on:
      - sync-server
